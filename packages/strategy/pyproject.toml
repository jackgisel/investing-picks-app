[project]
name = "outpick-strategy"
version = "0.1.0"
description = "Pure Run 118 strategy rules shared by live and backtest"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outpick_strategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
