[project]
name = "outpick-api"
version = "0.1.0"
description = "FastAPI service for Outpick virtual portfolio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "outpick-strategy",
]

[tool.uv.sources]
outpick-strategy = { path = "../../packages/strategy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
