name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly replay of the pinned dataset (Phase 5). Walk-forward ingest is Phase 6.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: Do not fail compare (regenerating backtests/baselines/run118.json)
        type: boolean
        default: false

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: strategy + api (pytest)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # `scripts/pytest.sh` looks for `.venv/bin/python` first and falls back
      # to `python3`; on the runner the fallback is what runs, so install
      # everything into the system interpreter. Strategy is installed first so
      # pip does not try to fetch `outpick-strategy` from PyPI when the api
      # and worker packages declare it as a dependency.
      - name: Install python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/strategy
          python -m pip install -e apps/api -e apps/worker pytest httpx

      - name: Strategy tests
        run: sh scripts/pytest.sh packages/strategy/tests -q

      - name: API + worker tests
        run: sh scripts/pytest.sh apps/api/tests -q

  web:
    name: web (vitest + checks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web deps
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Web checks
        run: pnpm --dir apps/web check

  backtest:
    name: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PRs cannot read the dataset secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BACKTEST_DATASET_URL: ${{ secrets.BACKTEST_DATASET_URL }}
      BACKTEST_DATASET_TOKEN: ${{ secrets.BACKTEST_DATASET_TOKEN }}
      BACKTEST_S3_ENDPOINT: ${{ secrets.BACKTEST_S3_ENDPOINT }}
      BACKTEST_S3_ACCESS_KEY: ${{ secrets.BACKTEST_S3_ACCESS_KEY }}
      BACKTEST_S3_SECRET_KEY: ${{ secrets.BACKTEST_S3_SECRET_KEY }}
      BACKTEST_S3_BUCKET: ${{ secrets.BACKTEST_S3_BUCKET }}
      BACKTEST_S3_REGION: ${{ secrets.BACKTEST_S3_REGION }}
      UPDATE_BASELINE: ${{ github.event.inputs.update_baseline == true && '1' || github.event.inputs.update_baseline == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            backtest:
              - 'packages/strategy/**'
              - 'apps/worker/worker/services/scoring.py'
              - 'apps/worker/worker/services/backtest_**'
              - 'apps/worker/worker/backtest/**'
              - 'apps/api/app/services/replay.py'
              - 'apps/api/app/services/backtest_metrics.py'
              - 'backtests/**'
              - 'datasets/manifest.json'
              - '.github/workflows/test.yml'
              - 'scripts/backtest-ci.sh'

      - name: Decide whether to run
        id: decide
        run: |
          run=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run=true
          elif echo "${{ join(github.event.pull_request.labels.*.name, ',') }}" | grep -q 'run-backtest'; then
            run=true
          elif [ "${{ steps.filter.outputs.backtest }}" = "true" ]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "backtest run=$run"

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install python packages
        if: steps.decide.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/strategy
          python -m pip install -e apps/api -e apps/worker
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Read dataset pin
        if: steps.decide.outputs.run == 'true'
        id: pin
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open("datasets/manifest.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"sha256={m['sha256']}\n")
              fh.write(f"dataset={m['dataset']}\n")
          PY

      - uses: actions/cache@v4
        if: steps.decide.outputs.run == 'true'
        with:
          path: datasets/dataset-v1.sqlite
          key: backtest-dataset-${{ steps.pin.outputs.sha256 }}

      - name: Check dataset credentials
        if: steps.decide.outputs.run == 'true'
        id: creds
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          pin = "${{ steps.pin.outputs.sha256 }}"
          dest = Path("datasets/dataset-v1.sqlite")
          ready = False
          if dest.exists() and pin:
              digest = hashlib.sha256()
              with dest.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      digest.update(chunk)
              ready = digest.hexdigest() == pin
          has_url = bool(os.environ.get("BACKTEST_DATASET_URL"))
          has_s3 = bool(os.environ.get("BACKTEST_S3_ACCESS_KEY"))
          ok = ready or has_url or has_s3
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"ok={'true' if ok else 'false'}\n")
              fh.write(f"cached={'true' if ready else 'false'}\n")
          if not ok:
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("## Backtest skipped\n\n")
                      fh.write("No dataset secrets and no cache hit. Add `BACKTEST_DATASET_URL` + ")
                      fh.write("`BACKTEST_DATASET_TOKEN` (or `BACKTEST_S3_*` for bucket `outpick-backtest`).\n")
          PY

      - name: Run backtest
        if: steps.decide.outputs.run == 'true' && steps.creds.outputs.ok == 'true'
        run: sh scripts/backtest-ci.sh

      - name: Upload artifacts
        if: steps.decide.outputs.run == 'true' && steps.creds.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-run118
          path: |
            /tmp/backtest-result.json
            /tmp/backtest-report.md
            /tmp/backtest-equity.csv
          if-no-files-found: error

      - name: Compare to baseline
        if: steps.decide.outputs.run == 'true' && steps.creds.outputs.ok == 'true'
        env:
          PYTHONPATH: apps/api:apps/worker:packages/strategy/src
        run: |
          set -eu
          BASELINE=backtests/baselines/run118.json
          OUT=/tmp/backtest-result.json
          FLAGS="--summary"
          if [ "${UPDATE_BASELINE:-}" = "1" ]; then
            FLAGS="$FLAGS --update-baseline"
          fi
          if [ ! -f "$BASELINE" ]; then
            {
              echo "## Backtest compare"
              echo ""
              echo "No committed baseline at \`$BASELINE\`."
              echo "Download the \`backtest-run118\` artifact and commit \`backtest-result.json\` as that path."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${UPDATE_BASELINE:-}" = "1" ]; then
              mkdir -p backtests/baselines
              cp "$OUT" "$BASELINE"
              echo "UPDATE_BASELINE=1 wrote $BASELINE (not committed)."
              exit 0
            fi
            exit 2
          fi
          python3 -m worker.backtest compare "$OUT" "$BASELINE" $FLAGS >> "$GITHUB_STEP_SUMMARY"
